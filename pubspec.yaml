name: bangla_voice_crm
description: Bangla Voice CRM
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter

  path_provider: ^2.1.2
  path: ^1.9.0
  sqflite: ^2.3.2
  http: ^1.2.0
  permission_handler: ^11.3.1
  file_picker: ^8.0.3
  csv: ^6.0.0
  share_plus: ^12.0.2
  url_launcher: ^6.3.0
  intl: ^0.19.0
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.2
  provider: ^6.1.2
  bcrypt: ^1.1.3
  geolocator: ^12.0.0
  geocoding: ^3.0.0
  flutter_local_notifications: ^21.0.0
  flutter_map: ^8.3.0
  latlong2: ^0.9.1
  image_picker: ^1.1.2
  audioplayers: ^6.1.0
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4

# Generated by: dart run flutter_launcher_icons
# Source artwork and the derived adaptive layers are produced by
# tools/prepare_app_icon.py — see that script before editing these paths.
flutter_launcher_icons:
  android: "ic_launcher"
  # This project has no iOS Runner.xcodeproj / Assets.xcassets, so the iOS leg
  # would crash on a missing path. Set true after running `flutter create .`
  # if iOS is ever added.
  ios: false
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  # Adaptive icons (Android 8+) crop to a circle/squircle, so the foreground
  # carries the artwork inset into the safe zone and the background supplies
  # the gradient that fills the cropped area.
  adaptive_icon_background: "assets/icon/app_icon_background.png"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"

flutter:
  uses-material-design: true
